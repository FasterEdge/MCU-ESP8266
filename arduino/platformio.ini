; FasterEdge MCU (ESP8266) — PlatformIO 配置
; 依赖：PubSubClient (MQTT)、Preferences 由 ESP8266 Arduino core 提供
[env:esp8266]
platform = espressif8266
board = esp12e
framework = arduino
monitor_speed = 115200

lib_deps =
    knolleary/PubSubClient@^2.8

; 其他常见板子：nodemcuv2 / d1_mini / esp01_1m 等，换 board 即可
; [env:nodemcuv2]
; platform = espressif8266
; board = nodemcuv2
; framework = arduino
; monitor_speed = 115200
; lib_deps = knolleary/PubSubClient@^2.8