; FasterEdge MCU (ESP8266) — platformio_ide 版
; VS Code + PlatformIO 插件直接打开本目录即可编译/烧录/监视串口
; 本版本为「裸机 C + ESP8266 NONOS SDK 框架」，与 arduino/（Arduino C++ 版）区分。
;
; 使用方法（VS Code）:
;   1. 安装 PlatformIO IDE 插件
;   2. 打开本目录 (platformio_ide)
;   3. 底部状态栏点 Build / Upload / Serial Monitor
;
; 命令行:
;   pio run -d . && pio run -d . -t upload && pio device monitor
[env:esp8266]
platform = espressif8266
board = esp12e
framework = esp8266-nonos-sdk
monitor_speed = 115200
build_flags =
    -DESP8266

; 其他常见板子：nodemcuv2 / d1_mini / esp01_1m 等，换 board 即可
; [env:nodemcuv2]
; platform = espressif8266
; board = nodemcuv2
; framework = esp8266-nonos-sdk
; monitor_speed = 115200

; WiFi 连接（MQTT/SNTP 需要）：在 main.c 的 user_init 中调用
; wifi_set_opmode + wifi_station_set_config，或在应用层配置