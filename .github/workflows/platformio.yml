# FasterEdge 开源项目 - Github: https://github.com/FasterEdge - Gitee: https://gitee.com/FasterEdge
# MCU 固件 CI: PlatformIO 编译主工程 arduino/; platformio_ide(IDE 模板/移植骨架)做结构检查。
name: 'PlatformIO 构建'

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pio-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: '安装 PlatformIO'
        run: pip install -q platformio
      - name: '构建主工程 arduino/'
        run: |
          set -e
          if [ -f arduino/platformio.ini ]; then
            echo "===== pio run: arduino ====="
            pio run -d arduino
          else
            echo "无 arduino/ 工程"
          fi
      - name: 'platformio_ide 结构检查(移植骨架, 不编译)'
        run: |
          set -e
          [ -f platformio_ide/platformio.ini ] || { echo "缺失 platformio_ide/platformio.ini"; exit 1; }
          n=$(find platformio_ide -maxdepth 3 \( -name '*.c' -o -name '*.cpp' -o -name '*.asm' \) -not -path '*/\.git/*' | wc -l)
          echo "platformio_ide 源码文件数: $n"
          [ "$n" -gt 0 ] || { echo "platformio_ide 无源码"; exit 1; }